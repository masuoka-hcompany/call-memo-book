# Dev Container 用の差分: 開発サーバーは自動起動せず、ターミナルから npm run dev で起動する
services:
  app:
    command: ["sleep", "infinity"]
    environment:
      # Claude Code の設定とログイン情報を、下のボリュームに置く（コンテナを作り直しても残る）
      CLAUDE_CONFIG_DIR: /home/node/.claude
    volumes:
      - claude_config:/home/node/.claude

volumes:
  claude_config:
