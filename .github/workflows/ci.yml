# プルリクエスト時: 型チェックとテスト
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # worker-configuration.d.ts が wrangler.jsonc と合っていること（合わないときは npm run types で作り直す）
      - run: npm run types:check
      - run: npm run typecheck
      - run: npm test
